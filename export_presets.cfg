[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,tools/*,*.zip,*.cfg 2,*.tscn 2,*.tscn 3"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><style>html,body{margin:0;overscroll-behavior:none;touch-action:none;background:#090c13}#canvas{touch-action:none}#status{font-family:system-ui}@media(orientation:portrait){body::after{content:\"Rotate your phone to landscape to play\";position:fixed;top:12px;left:0;right:0;text-align:center;color:#ebc56b;font:15px system-ui;pointer-events:none;z-index:50}}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
